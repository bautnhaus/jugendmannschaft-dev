name: E05 PROD Paket 2 – isolated PostgreSQL validation

on:
  push:
    branches: [develop]
    paths:
      - 'docs/prod-release/E05_PROD_PAKET_02_TRAININGSEVENT_RPC_2026-11-14.sql'
      - 'docs/prod-release/E05_PROD_PAKET_02_TRAININGSEVENT_RPC_2026-11-14_ROLLBACK.sql'
      - 'docs/prod-release/test-package-02/**'
      - '.github/workflows/e05-prod-package-02-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e05_package_02_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e05_package_02_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: e05_package_02_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare Supabase-like package 1 fixture
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-01/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f docs/prod-release/E05_PROD_PAKET_01_TRAININGSEREIGNISSE_2026-11-14.sql
          psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-02/bootstrap.sql
      - name: Apply exact PROD package 2 SQL
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/E05_PROD_PAKET_02_TRAININGSEVENT_RPC_2026-11-14.sql
      - name: Verify RPC security, event creation, audit atomicity and rejection cases
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-02/assertions.sql
      - name: Verify guarded rollback before package 3
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/prod-release/E05_PROD_PAKET_02_TRAININGSEVENT_RPC_2026-11-14_ROLLBACK.sql
          psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF to_regprocedure('public.award_training_behavior_event(uuid,uuid,text,text)') IS NOT NULL THEN RAISE EXCEPTION 'Paket-2 RPC remains after rollback'; END IF; END \$\$;"
