name: E05 PROD Paket 3 – isolated PostgreSQL validation

on:
  push:
    branches: [develop]
    paths:
      - 'supabase/migrations/20261114180000_e05_prod_paket_03_suspension_foundation.sql'
      - 'supabase/rollback/20261114180000_e05_prod_paket_03_suspension_foundation_rollback.sql'
      - 'docs/prod-release/test-package-03/**'
      - '.github/workflows/e05-prod-package-03-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e05_package_03_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e05_package_03_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: e05_package_03_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare package 1 and package 2 baseline
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-01/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f docs/prod-release/E05_PROD_PAKET_01_TRAININGSEREIGNISSE_2026-11-14.sql
          psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-02/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f docs/prod-release/E05_PROD_PAKET_02_TRAININGSEVENT_RPC_2026-11-14.sql
      - name: Prepare team and player fixture helpers
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-03/bootstrap.sql
      - name: Apply exact PROD package 3 SQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261114180000_e05_prod_paket_03_suspension_foundation.sql
      - name: Verify structure, ACL, red/yellow triggers and audit atomicity
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-03/assertions.sql
      - name: Verify guarded rollback and restoration of package 2 RPC
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/rollback/20261114180000_e05_prod_paket_03_suspension_foundation_rollback.sql
          psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF to_regclass('public.training_suspensions') IS NOT NULL OR to_regclass('public.training_suspension_audit') IS NOT NULL THEN RAISE EXCEPTION 'Package 3 tables remain after rollback'; END IF; IF to_regprocedure('public.award_training_behavior_event(uuid,uuid,text,text)') IS NULL THEN RAISE EXCEPTION 'Package 2 RPC was not restored'; END IF; END \$\$;"
