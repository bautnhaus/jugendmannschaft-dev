name: E05 PROD Paket 1 – isolated PostgreSQL validation

on:
  push:
    branches: [develop]
    paths:
      - 'docs/prod-release/E05_PROD_PAKET_01_TRAININGSEREIGNISSE_2026-11-14.sql'
      - 'docs/prod-release/E05_PROD_PAKET_01_TRAININGSEREIGNISSE_2026-11-14_ROLLBACK.sql'
      - 'docs/prod-release/test-package-01/**'
      - '.github/workflows/e05-prod-package-01-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e05_package_01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e05_package_01_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: e05_package_01_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare isolated Supabase-like fixture
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-01/bootstrap.sql
      - name: Apply exact PROD package SQL
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/E05_PROD_PAKET_01_TRAININGSEREIGNISSE_2026-11-14.sql
      - name: Verify schema, RLS, grants, indexes and append-only guard
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-01/assertions.sql
      - name: Verify rollback guards reject data and dependent packages
        run: psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-01/rollback_guard_assertions.sql
      - name: Verify guarded rollback and clean removal
        run: |
          psql -v ON_ERROR_STOP=1 -f docs/prod-release/E05_PROD_PAKET_01_TRAININGSEREIGNISSE_2026-11-14_ROLLBACK.sql
          psql -v ON_ERROR_STOP=1 -f docs/prod-release/test-package-01/rollback_assertions.sql
